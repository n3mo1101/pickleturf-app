[build]
builder = "nixpacks"

[deploy]
startCommand = "/opt/venv/bin/gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
preDeployCommand = "/opt/venv/bin/python manage.py migrate && /opt/venv/bin/python manage.py seed_courts && /opt/venv/bin/python manage.py createsuperuser --no-input || true"
restartPolicyType = "on_failure"

