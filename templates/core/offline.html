{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're offline</title>
    <link rel="icon" href="{% static 'img/logo-256.png' %}" type="image/jpeg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/base.css' %}" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: var(--pt-navy);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }
        .offline-card {
            background: var(--bg-card);
            border-radius: 18px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 12px 48px rgba(0,0,0,.35);
        }
        .offline-icon {
            font-size: 4rem;
            color: var(--pt-yellow);
            margin-bottom: 20px;
        }
        h2 {
            color: var(--pt-navy);
            font-weight: 800;
            margin-bottom: 12px;
        }
        p { color: var(--text-muted); margin-bottom: 28px; }
        .btn-retry {
            background: var(--pt-navy);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 32px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            transition: background .2s;
        }
        .btn-retry:hover { background: var(--pt-navy-dark); }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon">
            <i class="bi bi-wifi-off"></i>
        </div>
        <h2>You're offline</h2>
        <p>
            No internet connection detected.
            Previously visited pages are still available below.
            Check your connection and try again.
        </p>
        <button class="btn-retry" onclick="window.location.reload()">
            <i class="bi bi-arrow-clockwise me-2"></i>Try again
        </button>
        <div class="mt-4">
            <a href="/" style="color:var(--pt-navy);font-size:.9rem;">
                <i class="bi bi-house me-1"></i>Go to home
            </a>
        </div>
    </div>
</body>
</html>
